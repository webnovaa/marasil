# Production overlay: no Postgres/Redis/WhatsApp ports published.
# Frontend assets are baked into docker/php/Dockerfile (runtime stage).
# Use:
#   COMPOSE_PROFILES=prod docker compose -f compose.yaml -f compose.prod.yaml --profile prod up --build -d
#
# First boot (root .env):
#   APP_ENV=production
#   APP_DEBUG=false
#   RUN_MIGRATIONS=true
#   RUN_DB_SEED=true
#   SUPER_ADMIN_PHONE=+9639xxxxxxx
#   SUPER_ADMIN_PASSWORD=at_least_12_chars
# After first successful seed, set RUN_DB_SEED=false (prefer explicit migrate later).

services:
  nginx:
    restart: unless-stopped

  api:
    build:
      context: .
      dockerfile: docker/php/Dockerfile
    restart: unless-stopped
    environment:
      APP_ENV: ${APP_ENV:-production}
      APP_DEBUG: ${APP_DEBUG:-false}
      RUN_MIGRATIONS: ${RUN_MIGRATIONS:-false}
      RUN_DB_SEED: ${RUN_DB_SEED:-false}
      SUPER_ADMIN_PHONE: ${SUPER_ADMIN_PHONE:-}
      SUPER_ADMIN_PASSWORD: ${SUPER_ADMIN_PASSWORD:-}
      SUPER_ADMIN_NAME: ${SUPER_ADMIN_NAME:-Super Admin}
      SUPER_ADMIN_COMPANY: ${SUPER_ADMIN_COMPANY:-}
    volumes: !override
      - platform_private_storage:/var/www/html/storage/app

  horizon:
    build:
      context: .
      dockerfile: docker/php/Dockerfile
    restart: unless-stopped
    environment:
      APP_ENV: ${APP_ENV:-production}
      APP_DEBUG: ${APP_DEBUG:-false}
      # Never migrate/seed from workers
      RUN_MIGRATIONS: "false"
      RUN_DB_SEED: "false"
    volumes: !override
      - platform_private_storage:/var/www/html/storage/app

  scheduler:
    build:
      context: .
      dockerfile: docker/php/Dockerfile
    restart: unless-stopped
    environment:
      APP_ENV: ${APP_ENV:-production}
      APP_DEBUG: ${APP_DEBUG:-false}
      RUN_MIGRATIONS: "false"
      RUN_DB_SEED: "false"
    volumes: !override
      - platform_private_storage:/var/www/html/storage/app

  whatsapp-service:
    restart: unless-stopped
    environment:
      PORT: 3100
      LOG_LEVEL: ${WA_LOG_LEVEL:-info}
      WORKER_ID: ${WA_WORKER_ID:-wa-worker-1}
      NODE_ENV: production
      INTERNAL_HMAC_SECRET: ${INTERNAL_HMAC_SECRET:?INTERNAL_HMAC_SECRET is required}
      SESSION_MASTER_KEY: ${SESSION_MASTER_KEY:-}
      SOCKET_TOKEN_SECRET: ${SOCKET_TOKEN_SECRET:-}
      WHATSAPP_ENGINE: baileys

  postgres:
    restart: unless-stopped

  redis:
    restart: unless-stopped

volumes:
  platform_private_storage:
