name: whatsapp-saas

# Local development:
#   COMPOSE_PROFILES=dev
#   docker compose -f compose.yaml -f compose.dev.yaml --profile dev up --build -d
#
# Production:
#   COMPOSE_PROFILES=prod
#   docker compose -f compose.yaml -f compose.prod.yaml --profile prod up --build -d

networks:
  public:
  internal:

volumes:
  postgres_data:
  redis_data:
  whatsapp_sessions:
  platform_storage_framework:
  platform_storage_logs:
  platform_bootstrap_cache:

services:
  nginx:
    image: nginx:1.28-alpine
    profiles: ["dev", "prod"]
    ports:
      - "${NGINX_HTTP_PORT:-8080}:80"
    volumes:
      - ./docker/nginx/upgrade-map.conf:/etc/nginx/conf.d/00-upgrade-map.conf:ro
      - ./docker/nginx/default.conf:/etc/nginx/conf.d/default.conf:ro
      - ./apps/platform/public:/var/www/html/public:ro
    depends_on:
      api:
        condition: service_healthy
      whatsapp-service:
        condition: service_started
    networks:
      - public
      - internal
    restart: unless-stopped
    healthcheck:
      test: ["CMD", "wget", "-qO-", "http://127.0.0.1/up"]
      interval: 20s
      timeout: 5s
      retries: 5
      start_period: 40s

  api:
    build:
      context: .
      dockerfile: docker/php/Dockerfile.dev
    profiles: ["dev", "prod"]
    command: ["sh", "-c", "sed 's/\\r$//' /usr/local/bin/laravel-entrypoint.sh > /tmp/laravel-entrypoint.sh && chmod +x /tmp/laravel-entrypoint.sh && sh /tmp/laravel-entrypoint.sh php-fpm -F"]
    env_file:
      - .env
    working_dir: /var/www/html
    volumes:
      - ./apps/platform:/var/www/html
      - ./docker/php/entrypoint.sh:/usr/local/bin/laravel-entrypoint.sh:ro
      - platform_storage_framework:/var/www/html/storage/framework
      - platform_storage_logs:/var/www/html/storage/logs
      - platform_bootstrap_cache:/var/www/html/bootstrap/cache
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
    networks:
      - internal
    restart: unless-stopped
    mem_limit: 1g
    healthcheck:
      test: ["CMD-SHELL", "php -v >/dev/null || exit 1"]
      interval: 20s
      timeout: 5s
      retries: 5

  horizon:
    build:
      context: .
      dockerfile: docker/php/Dockerfile.dev
    profiles: ["dev", "prod"]
    command: ["sh", "-c", "sed 's/\\r$//' /usr/local/bin/laravel-entrypoint.sh > /tmp/laravel-entrypoint.sh && chmod +x /tmp/laravel-entrypoint.sh && sh /tmp/laravel-entrypoint.sh php artisan horizon"]
    env_file:
      - .env
    working_dir: /var/www/html
    volumes:
      - ./apps/platform:/var/www/html
      - ./docker/php/entrypoint.sh:/usr/local/bin/laravel-entrypoint.sh:ro
      - platform_storage_framework:/var/www/html/storage/framework
      - platform_storage_logs:/var/www/html/storage/logs
      - platform_bootstrap_cache:/var/www/html/bootstrap/cache
    depends_on:
      api:
        condition: service_started
      redis:
        condition: service_healthy
    networks:
      - internal
    restart: unless-stopped

  scheduler:
    build:
      context: .
      dockerfile: docker/php/Dockerfile.dev
    profiles: ["dev", "prod"]
    command: ["sh", "-c", "sed 's/\\r$//' /usr/local/bin/laravel-entrypoint.sh > /tmp/laravel-entrypoint.sh && chmod +x /tmp/laravel-entrypoint.sh && sh /tmp/laravel-entrypoint.sh sh -c 'while true; do php artisan schedule:run --verbose --no-interaction; sleep 60; done'"]
    env_file:
      - .env
    working_dir: /var/www/html
    volumes:
      - ./apps/platform:/var/www/html
      - ./docker/php/entrypoint.sh:/usr/local/bin/laravel-entrypoint.sh:ro
      - platform_storage_framework:/var/www/html/storage/framework
      - platform_storage_logs:/var/www/html/storage/logs
      - platform_bootstrap_cache:/var/www/html/bootstrap/cache
    depends_on:
      api:
        condition: service_started
      redis:
        condition: service_healthy
    networks:
      - internal
    restart: unless-stopped

  whatsapp-service:
    build:
      context: ./apps/whatsapp-service
      dockerfile: Dockerfile
    profiles: ["dev", "prod"]
    environment:
      PORT: 3100
      LOG_LEVEL: ${WA_LOG_LEVEL:-info}
      WORKER_ID: ${WA_WORKER_ID:-wa-worker-1}
      NODE_ENV: production
      INTERNAL_HMAC_SECRET: ${INTERNAL_HMAC_SECRET:?INTERNAL_HMAC_SECRET is required}
      SOCKET_TOKEN_SECRET: ${SOCKET_TOKEN_SECRET:-}
      SESSION_MASTER_KEY: ${SESSION_MASTER_KEY:-}
      SESSION_KEY_ID: ${SESSION_KEY_ID:-v1}
      SESSION_STORE_PATH: /data/sessions
      WHATSAPP_ENGINE: ${WHATSAPP_ENGINE:-baileys}
      PLATFORM_INTERNAL_URL: ${PLATFORM_INTERNAL_URL:-http://nginx}
    volumes:
      - whatsapp_sessions:/data/sessions
    networks:
      - internal
    restart: unless-stopped
    stop_grace_period: 15s
    healthcheck:
      test: ["CMD", "wget", "-qO-", "http://127.0.0.1:3100/health/ready"]
      interval: 15s
      timeout: 5s
      retries: 5
      start_period: 20s

  postgres:
    image: postgres:18-alpine
    profiles: ["dev", "prod"]
    environment:
      POSTGRES_DB: ${DB_DATABASE:-whatsapp_saas}
      POSTGRES_USER: ${DB_USERNAME:-whatsapp}
      POSTGRES_PASSWORD: ${DB_PASSWORD:?DB_PASSWORD is required}
    volumes:
      - postgres_data:/var/lib/postgresql
    networks:
      - internal
    restart: unless-stopped
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${DB_USERNAME:-whatsapp} -d ${DB_DATABASE:-whatsapp_saas}"]
      interval: 10s
      timeout: 5s
      retries: 10

  redis:
    image: redis:8.2-alpine
    profiles: ["dev", "prod"]
    environment:
      REDIS_PASSWORD: ${REDIS_PASSWORD:?REDIS_PASSWORD is required}
    command: ["redis-server", "--requirepass", "${REDIS_PASSWORD:?REDIS_PASSWORD is required}", "--appendonly", "yes"]
    volumes:
      - redis_data:/data
    networks:
      - internal
    restart: unless-stopped
    healthcheck:
      test: ["CMD-SHELL", "redis-cli -a \"$$REDIS_PASSWORD\" PING | grep -q PONG"]
      interval: 10s
      timeout: 5s
      retries: 10

  vite:
    image: node:24-alpine
    profiles: ["dev"]
    working_dir: /var/www/html
    command: sh -c "if [ ! -d node_modules ]; then npm install; fi && npm run dev -- --host 0.0.0.0 --port 5173"
    volumes:
      - ./apps/platform:/var/www/html
    ports:
      - "${VITE_PORT:-5173}:5173"
    networks:
      - public
      - internal
    restart: unless-stopped
